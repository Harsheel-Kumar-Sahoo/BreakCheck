openapi: 3.0.3
info:
  title: Orders API
  version: 3.0.0
paths:
  /orders:
    get:
      summary: List orders
      deprecated: true
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, paid, shipped]
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [items]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create an order
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid input
  /orders/{id}:
    get:
      summary: Get one order
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
  /orders/{id}/items:
    get:
      summary: List items of an order
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderItem"
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
  schemas:
    Order:
      type: object
      required: [id, customerId, amount, status, createdAt]
      properties:
        id:
          type: string
        customerId:
          type: string
        amount:
          type: object
          required: [value, currency]
          properties:
            value:
              type: number
            currency:
              type: string
        status:
          type: string
          enum: [pending, paid, shipped, refunded]
        createdAt:
          type: string
          format: date-time
    NewOrder:
      type: object
      required: [customerId, total, currency]
      properties:
        customerId:
          type: integer
        total:
          type: number
        currency:
          type: string
    OrderItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer